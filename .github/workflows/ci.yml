name: Bharat AI-SOC Edge CI & Release Builder

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release-binaries:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ARM64 Cross-Compiler (Non-Interactive)
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Compile Standalone Executables (ARM64 aarch64 & Linux x86_64)
        run: |
          # 1. Stage 1 Standalone ARM64 Linux/Android Executable (with Hardware ARM NEON SIMD)
          aarch64-linux-gnu-gcc -O3 -march=armv8-a+simd -static -o bharat-ai-soc-linux-arm64 bharat_soc_app.c neon_kernel.c -lm
          aarch64-linux-gnu-gcc -O3 -fPIC -shared -march=armv8-a+simd -o neon_kernel_arm64.so neon_kernel.c -lm

          # 2. Stage 1 Standalone x86_64 Linux Executable
          gcc -O3 -fPIC -shared -o neon_kernel.so neon_kernel.c -lm
          gcc -O3 -o bharat-ai-soc-linux-x86_64 bharat_soc_app.c neon_kernel.c -lm

          # 3. Stage 2 Native ExecuTorch INT4 Co-Processor Runner (ARM64 & x86_64)
          aarch64-linux-gnu-gcc -O3 -static -o executor_runner_arm64 executor_runner.c
          gcc -O3 -o executor_runner executor_runner.c

          chmod +x bharat-ai-soc-linux-arm64 bharat-ai-soc-linux-x86_64 executor_runner_arm64 executor_runner
          ls -lh bharat-ai-soc-linux-arm64 neon_kernel_arm64.so bharat-ai-soc-linux-x86_64 neon_kernel.so executor_runner_arm64 executor_runner

      - name: Run 26-Vector Confusion Matrix & Stage 2 Verification
        run: |
          pip install rich psutil pytest
          python fuzzer.py < /dev/null
          python llm_engine.py
          python -c "import json; r = json.load(open('fuzz_report.json')); assert r['metrics']['f1_score_percent'] == 100.0; assert r['confusion_matrix']['FP'] == 0"

      - name: Upload Compiled Binaries as Action Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bharat-ai-soc-compiled-executables
          if-no-files-found: ignore
          path: |
            bharat-ai-soc-linux-arm64
            neon_kernel_arm64.so
            bharat-ai-soc-linux-x86_64
            neon_kernel.so
            executor_runner_arm64
            executor_runner
            bin/*

      - name: Create or Update GitHub Release v3.0.0 (Deliverable #2)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag -f v3.0.0
          git push origin v3.0.0 --force
          gh release view v3.0.0 >/dev/null 2>&1 || gh release create v3.0.0 --title "Bharat AI-SOC v3.0.0 — Compiled ARM64 & Linux Edge Executables" --notes "Official pre-compiled standalone ARM64 (aarch64 NEON SIMD) and Linux x86_64 executables for Deliverable #2 (Stage 1 C-SIMD Kernel + Stage 2 Native INT4 Runner)."
          gh release upload v3.0.0 bharat-ai-soc-linux-arm64 neon_kernel_arm64.so bharat-ai-soc-linux-x86_64 neon_kernel.so executor_runner_arm64 executor_runner --clobber