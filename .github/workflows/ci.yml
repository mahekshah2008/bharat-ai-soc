name: Bharat AI-SOC Edge CI & Release Builder

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release-binaries:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ARM64 Cross-Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Compile Standalone Executables (ARM64 aarch64 & Linux x86_64)
        run: |
          # 1. Standalone ARM64 Linux/Android Executable (with Hardware ARM NEON SIMD)
          aarch64-linux-gnu-gcc -O3 -march=armv8-a+simd -static -o bharat-ai-soc-linux-arm64 bharat_soc_app.c neon_kernel.c -lm
          aarch64-linux-gnu-gcc -O3 -fPIC -shared -march=armv8-a+simd -o neon_kernel_arm64.so neon_kernel.c -lm

          # 2. Standalone x86_64 Linux Executable
          gcc -O3 -fPIC -shared -o neon_kernel.so neon_kernel.c -lm
          gcc -O3 -o bharat-ai-soc-linux-x86_64 bharat_soc_app.c neon_kernel.c -lm

          chmod +x bharat-ai-soc-linux-arm64 bharat-ai-soc-linux-x86_64

      - name: Run 26-Vector Confusion Matrix Verification
        run: |
          pip install rich psutil pytest
          python fuzzer.py

      - name: Upload Compiled Binaries as Action Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bharat-ai-soc-compiled-executables
          path: |
            bharat-ai-soc-linux-arm64
            neon_kernel_arm64.so
            bharat-ai-soc-linux-x86_64
            neon_kernel.so
            bharat-ai-soc.exe
            neon_kernel.dll

      - name: Publish Official GitHub Release (Deliverable #2)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.0
          name: "Bharat AI-SOC v3.0.0 — Compiled ARM64 & Linux Edge Executables"
          body: |
            ### Deliverable #2: Compiled Working Application Binaries
            - **`bharat-ai-soc-linux-arm64`**: Standalone static ARM64 (`aarch64` ARMv8-A + NEON SIMD) native executable for Raspberry Pi 5, ARM Linux, and Android/Termux.
            - **`bharat-ai-soc-linux-x86_64`**: Standalone Linux x86_64 native executable.
            - **`bharat-ai-soc.exe`**: Standalone Windows x86_64 native executable.
            - **`neon_kernel_arm64.so` / `neon_kernel.so` / `neon_kernel.dll`**: Compiled Stage 1 C-SIMD shared libraries.
          files: |
            bharat-ai-soc-linux-arm64
            neon_kernel_arm64.so
            bharat-ai-soc-linux-x86_64
            neon_kernel.so
            bharat-ai-soc.exe
            neon_kernel.dll