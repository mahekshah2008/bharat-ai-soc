build-android-apk:
    name: Build Native ARM64 Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Compile libneon_kernel.so & Package Signed APK
        run: |
          ANDROID_HOME=/usr/local/lib/android/sdk
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          PLATFORM=$(ls -d $ANDROID_HOME/platforms/android-* | tail -n 1)/android.jar
          NDK=$(ls -d $ANDROID_HOME/ndk/* | tail -n 1)
          CLANG="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"

          mkdir -p build_apk/lib/arm64-v8a build_apk/obj build_apk/dex
          $CLANG -O3 -fPIC -shared -march=armv8-a+simd \
            neon_kernel.c android_app/jni_bridge.c \
            -o build_apk/lib/arm64-v8a/libneon_kernel.so -llog -lm

          $BUILD_TOOLS/aapt2 link -o build_apk/unaligned.apk \
            -I "$PLATFORM" \
            --manifest android_app/AndroidManifest.xml \
            -A android_app/assets \
            --java build_apk/obj

          javac -source 11 -target 11 -cp "$PLATFORM" -d build_apk/obj \
            android_app/MainActivity.java build_apk/obj/com/bharataisoc/edge/R.java

          $BUILD_TOOLS/d8 --lib "$PLATFORM" --output build_apk/dex \
            $(find build_apk/obj -name "*.class")

          cd build_apk
          cp dex/classes.dex .
          zip -u unaligned.apk classes.dex lib/arm64-v8a/libneon_kernel.so
          $BUILD_TOOLS/zipalign -f 4 unaligned.apk aligned.apk

          keytool -genkeypair -v -keystore debug.keystore -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=BharatAISOC,O=EdgeSecurity,C=IN"

          $BUILD_TOOLS/apksigner sign --ks debug.keystore --ks-pass pass:android \
            --key-pass pass:android --out ../bharat-ai-soc.apk aligned.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bharat-ai-soc-android-apk
          path: bharat-ai-soc.apk

      - name: Attach APK to GitHub Release v3.0.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.0
          files: bharat-ai-soc.apk